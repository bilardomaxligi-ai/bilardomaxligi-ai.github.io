<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>25. Bilardomax Ligi – TV</title>
<link rel="icon" href="favicon.png">
<style>
/* TV ekranı: 15 grubun çapraz tablosu tek ekranda sabit (4×4 kutu, 16. kutu bilgi). Boyutlar ekran yüksekliğine göre ölçeklenir. */
/* --u: ekranın hem enine hem boyuna sığan birim (16:9). Her şey buna göre ölçeklenir, sayfa asla ekrandan taşmaz. */
:root{--bg:#050b14;--kutu:#0c1a2b;--cizgi:#2b4c70;--yazi:#ffffff;--soluk:#a9bdd2;--altin:#ffc24a;--k:#3dff8e;--m:#ff6b61;--b:#7cc0ff;--u:min(1vh,.5625vw)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--yazi);font-family:"Segoe UI",Roboto,Arial,sans-serif;cursor:none}
.izgara{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:calc(var(--u)*.45);width:100vw;height:100vh;box-sizing:border-box;padding:calc(var(--u)*.45);overflow:hidden}
.kutu{background:var(--kutu);border:1px solid var(--cizgi);border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.35) calc(var(--u)*.45) calc(var(--u)*.25);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.kutu h2{margin:0 0 calc(var(--u)*.15);font-size:calc(var(--u)*1.55);line-height:1.1;color:var(--altin);display:flex;justify-content:space-between;align-items:baseline}
.kutu h2 span{color:var(--soluk);font-weight:600;font-size:calc(var(--u)*1.3)}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums;flex:1}
th,td{font-size:calc(var(--u)*1.08);line-height:1;padding:0;text-align:center;border-bottom:1px solid #1b3350;border-left:1px solid #1b3350;white-space:nowrap;overflow:hidden;font-weight:600}
th{color:var(--altin);font-weight:700;height:calc(var(--u)*1.3)}
td.no,th:first-child{color:var(--altin);font-weight:700;border-left:0}
td.ad{text-align:left;text-overflow:ellipsis;padding-left:calc(var(--u)*.3);font-weight:700;font-size:calc(var(--u)*1.2)}
th.ad{text-align:left;padding-left:calc(var(--u)*.3);color:var(--soluk);font-weight:700}
td.h{color:var(--soluk);font-weight:600}
td.x{background:repeating-linear-gradient(45deg,#2f4f72 0 calc(var(--u)*.35),#26425f calc(var(--u)*.35) calc(var(--u)*.7))}
td.ek{background:#0b1a2a;font-weight:700} td.p{color:var(--altin)} td.ilk{border-left:2px solid var(--altin)}
tr:nth-child(even) td:not(.x):not(.ek){background:#132940}
.k{color:var(--k);font-weight:700} .m{color:var(--m);font-weight:700} .b{color:var(--b);font-weight:700}
td.ust7{color:var(--altin)}
/* Çapraz tabloda sonuç hücresi renkli kutu: yeşil galibiyet, kırmızı mağlubiyet, mavi beraberlik */
.kutu tr td.k:not(.x):not(.ek){background:#127a3e;color:#fff}
.kutu tr td.m:not(.x):not(.ek){background:#8c2626;color:#fff}
.kutu tr td.b:not(.x):not(.ek){background:#1f5ea8;color:#fff}
/* 16. kutu: bilgi */
.bilgi{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.6);background:radial-gradient(circle at 50% 35%,#16304d 0%,#0b1726 80%)}
.bilgi .bm{height:calc(var(--u)*7.5);border-radius:calc(var(--u)*.8)}
.bilgi .ad{font-size:calc(var(--u)*2.4);font-weight:700;color:var(--altin)}
.bilgi .sp{font-size:calc(var(--u)*1.3);color:var(--soluk);font-style:italic;display:flex;align-items:center;gap:calc(var(--u)*.6)}
.bilgi .sp img{height:calc(var(--u)*2.3)}
.bilgi .gun{font-size:calc(var(--u)*1.45);color:var(--yazi);font-weight:600}
.bilgi .acik{font-size:calc(var(--u)*1.2);color:var(--soluk);line-height:1.5}
.bilgi .imza{font-size:calc(var(--u)*1.15);color:var(--soluk)} .bilgi .imza b{color:var(--altin);font-weight:600}
.hata{position:fixed;left:50%;bottom:1vh;transform:translateX(-50%);background:#3a1a1a;color:#ffd0cc;border:1px solid #6b2a2a;border-radius:.6vh;padding:.5vh 1.2vh;font-size:1.3vh;display:none;z-index:5}
/* Büyük çapraz tablo: ekranda 4 grup (2×2) ya da 6 grup (3×2), hücrede tam skor */
.izgara.b4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));--carp:1.5}
.izgara.b6{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));--carp:1.05}
.buyuk .kutu{padding:calc(var(--u)*.6) calc(var(--u)*.8) calc(var(--u)*.5)}
.buyuk .kutu h2{font-size:calc(var(--u)*var(--carp)*1.75);margin-bottom:calc(var(--u)*.4)}
.buyuk .kutu h2 span{font-size:calc(var(--u)*var(--carp)*1.2)}
.buyuk th,.buyuk td{font-size:calc(var(--u)*var(--carp))}
.buyuk th{height:calc(var(--u)*var(--carp)*1.5)}
.buyuk td.ad{font-size:calc(var(--u)*var(--carp)*1.2)}
.buyuk td.sk2{font-weight:700;letter-spacing:-.02em}
.buyuk th,.buyuk td{border-left-color:#2c5078}
.buyuk td.no,.buyuk th:first-child{border-left:0}
.buyuk td.sk2 .k{color:var(--k)} .buyuk td.sk2 .m{color:var(--m)} .buyuk td.sk2 .b{color:var(--b)}
.buyuk .bilgi .bm{height:calc(var(--u)*12)} .buyuk .bilgi .ad{font-size:calc(var(--u)*3.4)}
.buyuk .bilgi .sp{font-size:calc(var(--u)*1.9)} .buyuk .bilgi .sp img{height:calc(var(--u)*3.2)}
.buyuk .bilgi .gun{font-size:calc(var(--u)*2)} .buyuk .bilgi .acik{font-size:calc(var(--u)*1.6)} .buyuk .bilgi .imza{font-size:calc(var(--u)*1.5)}
/* Slayt gösterisi: toplu çapraz tablo → grup grup puan durumu → son maçlar */
.slayt{position:fixed;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none;overflow:hidden}
.slayt.on{opacity:1}
.ilerle{position:fixed;left:0;bottom:0;height:calc(var(--u)*.45);width:0;background:var(--altin);opacity:.85;z-index:4}
#s-diger{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#11263d 0%,var(--bg) 70%)}
.bas{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1);border-bottom:2px solid var(--cizgi)}
.bas>img{height:calc(var(--u)*6.4);border-radius:calc(var(--u)*.7)}
.bas .bt{display:flex;flex-direction:column;min-width:0}
.bas .bt small{font-size:calc(var(--u)*1.8);color:var(--soluk);font-weight:600}
.bas .bt b{font-size:calc(var(--u)*3.7);color:var(--altin);line-height:1.1;white-space:nowrap}
.bas .sag{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*.5);font-size:calc(var(--u)*1.9);color:var(--soluk);font-weight:600;white-space:nowrap}
.bas .sag .ek{font-size:calc(var(--u)*2.4);color:var(--yazi);font-weight:700}
.bas .spn{display:flex;align-items:center;gap:calc(var(--u)*.6);font-style:italic;font-size:calc(var(--u)*1.6)}
.bas .spn img{height:calc(var(--u)*2.5)}
#icerik{flex:1;min-height:0;padding:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.6)}
.pt{width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.pt th{font-size:calc(var(--u)*2);color:var(--altin);font-weight:700;padding-bottom:calc(var(--u)*.6);border:0;border-bottom:2px solid var(--cizgi);height:auto}
.pt td{font-size:calc(var(--u)*2.9);font-weight:700;border:0;border-bottom:1px solid #1b3350;text-align:center}
.pt th.ad,.pt td.ad{text-align:left;padding-left:calc(var(--u)*1.2);font-size:calc(var(--u)*2.9)}
.pt th.ad{font-size:calc(var(--u)*2)}
.pt tbody tr:nth-child(even) td{background:#0e2136}
.pt td.sira{color:var(--soluk)} .pt tr.ust td.sira{color:var(--altin)}
.pt tr.ayrac td{border-bottom:3px solid var(--altin)}
.pt td.p{color:var(--altin);font-size:calc(var(--u)*3.2)}
.pt td.hh,.pt td.ikincil{color:var(--soluk);font-weight:600}
.sm{display:grid;grid-auto-flow:column;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(16,minmax(0,1fr));column-gap:calc(var(--u)*2.4);height:100%}
.mc{display:grid;grid-template-columns:calc(var(--u)*5.4) calc(var(--u)*5.6) minmax(0,1fr) calc(var(--u)*3.4) calc(var(--u)*1.4) calc(var(--u)*3.4) minmax(0,1fr);align-items:center;font-size:calc(var(--u)*2.05);font-weight:700;border-bottom:1px solid #1b3350;min-height:0}
.mc:nth-child(even){background:#0e2136}
.mc .tr{color:var(--soluk);font-weight:600;font-size:calc(var(--u)*1.75);padding-left:calc(var(--u)*.5)}
.mc .gr{color:var(--altin);font-size:calc(var(--u)*1.75);white-space:nowrap}
.mc .o1,.mc .o2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .o1{text-align:right;padding-right:calc(var(--u)*.6)} .mc .o2{padding-left:calc(var(--u)*.6)}
.mc .sk{text-align:center;font-size:calc(var(--u)*2.3)} .mc .ay{text-align:center;color:var(--soluk)}
.bosmesaj{height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*3);color:var(--soluk)}
</style>
</head>
<body>
<div class="slayt" id="s-matris"><div class="izgara" id="izgara"></div></div>
<div class="slayt" id="s-diger">
  <header class="bas"><img src="logo.png" alt=""><div class="bt"><small>25. Bilardomax Ligi</small><b id="baslik"></b></div>
  <div class="sag"><span class="ek" id="ek"></span><span id="saat"></span><span class="spn">sponsored by <img src="marmatek.png" alt="Marmatek"></span></div></header>
  <main id="icerik"></main>
</div>
<div class="ilerle" id="ilerle"></div>
<div class="hata" id="hata">Bağlantı yok, son veriler gösteriliyor</div>
<script>
const VERI_ADRESI = location.hostname === 'localhost' ? '' : 'https://script.google.com/macros/s/AKfycbyQDjzNxQFmFrvgv81QPkcPoCan45LJureCexi0zVxUYZ52hntVW78ffgYPjLr4CgY9Pw/exec';
const ILK_KAC = 7, YENILE_SN = 60;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sinif = (a, b) => a > b ? 'k' : a < b ? 'm' : 'b';
function tarihYaz(s) { const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d)/.exec(s || ''); return m ? `${m[3]}.${m[2]}.${m[1]} ${m[4]}` : (s || ''); }

// Büyük çapraz tablo (ekranda 4 ya da 6 grup): hücrede telefondaki gibi tam skor, ör. 40-50 (satırdaki oyuncunun sayısı solda)
function buyukKutu(g) {
  const mac = {};
  for (const [t, a, sa, b, sb] of g.maclar) { mac[a + '|' + b] = [sa, sb]; mac[b + '|' + a] = [sb, sa]; }
  const ol = g.oyuncular, n = ol.length;
  const basl = `<tr><th style="width:calc(var(--u)*2.6)">#</th><th class="ad" style="width:19%">Oyuncu</th><th style="width:calc(var(--u)*2.8)">H</th>${ol.map((_, j) => `<th>${j + 1}</th>`).join('')}</tr>`;
  const satir = ol.map(([a, h], i) => {
    const hucre = ol.map(([b]) => { if (a === b) return '<td class="x"></td>'; const m = mac[a + '|' + b]; return m ? `<td class="sk2"><span class="${sinif(m[0], m[1])}">${esc(m[0])}</span>-<span class="${sinif(m[1], m[0])}">${esc(m[1])}</span></td>` : '<td></td>'; }).join('');
    return `<tr><td class="no">${i + 1}</td><td class="ad">${esc(a)}</td><td class="h">${esc(h)}</td>${hucre}</tr>`;
  }).join('');
  return `<div class="kutu"><h2>${g.no}. Grup<span>${g.maclar.length} / ${n * (n - 1) / 2} maç</span></h2><table>${basl}${satir}</table></div>`;
}
function matrisCiz(V, sayfa) {
  const iz = document.getElementById('izgara');
  if (GRUP < 15) {
    const gr = V.gruplar.slice(0, 15).slice(sayfa * GRUP, sayfa * GRUP + GRUP);
    const kutular = gr.map(buyukKutu);
    if (kutular.length < GRUP) kutular.push(`<div class="kutu bilgi"><img class="bm" src="logo.png" alt=""><div class="ad">25. Bilardomax Ligi</div><div class="sp">sponsored by <img src="marmatek.png" alt="Marmatek"></div><div class="gun">Son güncelleme: ${esc(tarihYaz(V.guncelleme))}</div><div class="acik">Hücrede satırdaki oyuncunun skoru solda · <span class="k">galibiyet</span> · <span class="m">mağlubiyet</span> · <span class="b">beraberlik</span><br>H: handikap</div><div class="imza">Created by <b>Ali Kazırlar</b></div></div>`);
    iz.className = 'izgara buyuk b' + GRUP; iz.innerHTML = kutular.join('');
    return;
  }
  iz.className = 'izgara';
  const kutular = V.gruplar.slice(0, 15).map(g => {
    const mac = {};
    for (const [t, a, sa, b, sb] of g.maclar) { mac[a + '|' + b] = [sa, sb]; mac[b + '|' + a] = [sb, sa]; }
    const ol = g.oyuncular, n = ol.length;
    const puan = {}; for (const s of g.puan) puan[s[1]] = s;
    const u = n => `width:calc(var(--u)*${n})`;
    const basl = `<tr><th style="${u(1.8)}">#</th><th class="ad" style="width:25%">Oyuncu</th><th style="${u(2.1)}">H</th>${ol.map((_, j) => `<th>${j + 1}</th>`).join('')}<th class="ilk" style="${u(2.1)}">S</th><th style="${u(2.1)}">P</th><th style="${u(2.8)}">Av</th></tr>`;
    const satir = ol.map(([a, h], i) => {
      const s = puan[a] || [];
      const hucre = ol.map(([b]) => { if (a === b) return '<td class="x"></td>'; const m = mac[a + '|' + b]; return m ? `<td class="${sinif(m[0], m[1])}">${esc(m[0])}</td>` : '<td></td>'; }).join('');
      return `<tr><td class="no">${i + 1}</td><td class="ad">${esc(a)}</td><td class="h">${esc(h)}</td>${hucre}<td class="ek ilk ${s[0] <= ILK_KAC ? 'ust7' : ''}">${esc(s[0])}</td><td class="ek p">${esc(s[7])}</td><td class="ek">${esc(s[10])}</td></tr>`;
    }).join('');
    return `<div class="kutu"><h2>${g.no}. Grup<span>${g.maclar.length} / ${n * (n - 1) / 2} maç</span></h2><table>${basl}${satir}</table></div>`;
  });
  kutular.push(`<div class="kutu bilgi"><img class="bm" src="logo.png" alt=""><div class="ad">25. Bilardomax Ligi</div><div class="sp">sponsored by <img src="marmatek.png" alt="Marmatek"></div><div class="gun">Son güncelleme: ${esc(tarihYaz(V.guncelleme))}</div><div class="acik">Hücrede satırdaki oyuncunun sayısı · <span class="k">galibiyet</span> · <span class="m">mağlubiyet</span> · <span class="b">beraberlik</span><br>H: handikap · S: sıra (altın: ilk ${ILK_KAC}) · P: puan · Av: averaj</div><div class="imza">Created by <b>Ali Kazırlar</b></div></div>`);
  iz.innerHTML = kutular.join('');
}

// ---- Slayt gösterisi ----
// Süreler (saniye): toplu çapraz tablo, her grubun puan durumu, son maçların toplamı.
// Çapraz tablo bir ekranda 4 grup gösterir (hücrede 40-50). ?grup=6 → 6 grup (65" 4K için), ?grup=15 → 15 grup tek ekran.
// Adres sonuna ?sabit eklenirse yalnızca 15 grubun toplu çapraz tablosu sabit gösterilir.
const SURE = { matris: 20, puan: 15, son: 60 };   // matris: her çapraz tablo slaytı (4 grup) kaç saniye
const SADECE_MATRIS = true;   // true: yalnızca çapraz tablo slaytları döner (puan durumu ve son maçlar kapalı)
const SON_SAYFA = 48, SON_EN_FAZLA_SAYFA = 4;
const P = new URLSearchParams(location.search);
const SABIT = P.has('sabit'), HIZ = Math.max(1, +P.get('hiz') || 1);
const GRUP = SABIT ? 15 : ([4, 6, 15].includes(+P.get('grup')) ? +P.get('grup') : 4);
const $ = id => document.getElementById(id);
let V = null, sira = [], idx = -1, zaman = null;

function sonMaclar() {
  // Ana sitedeki "Son maçlar" ile aynı: bugün ve önceki 6 gün, en yenisi önce
  const d = new Date(); d.setDate(d.getDate() - 6);
  const sinir = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hepsi = [];
  for (const g of V.gruplar) for (const m of g.maclar) if (m[0] && m[0] >= sinir) hepsi.push([...m, g.no]);
  return hepsi.sort((x, y) => (y[0] || '').localeCompare(x[0] || ''));
}
function plan() {
  const s = [], ms = Math.ceil(15 / GRUP);
  for (let i = 0; i < ms; i++) s.push({ t: 'matris', sayfa: i, sn: GRUP < 15 ? SURE.matris : 180 });
  if (SABIT || SADECE_MATRIS) return s;
  for (const g of V.gruplar.slice(0, 15)) s.push({ t: 'puan', g: g.no, sn: SURE.puan });
  const n = Math.min(SON_EN_FAZLA_SAYFA, Math.ceil(sonMaclar().length / SON_SAYFA));
  for (let i = 0; i < n; i++) s.push({ t: 'son', sayfa: i, top: n, sn: Math.max(15, Math.round(SURE.son / n)) });
  return s;
}
function saatYaz() { const d = new Date(); $('saat').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function puanCiz(no) {
  const g = V.gruplar.find(x => x.no === no); if (!g) return;
  const n = g.oyuncular.length;
  $('baslik').textContent = `${g.no}. Grup · Puan Durumu`;
  $('ek').textContent = `${g.maclar.length} / ${n * (n - 1) / 2} maç oynandı`;
  const av = v => v > 0 ? 'k' : v < 0 ? 'm' : '';
  $('icerik').innerHTML = `<table class="pt"><thead><tr><th style="width:6%">Sıra</th><th class="ad" style="width:30%">Oyuncu</th><th>Hnd</th><th>O</th><th>G</th><th>B</th><th>M</th><th>Puan</th><th>Attığı</th><th>Yediği</th><th>Averaj</th></tr></thead><tbody>${
    g.puan.map((s, i) => `<tr class="${i < ILK_KAC ? 'ust' : ''} ${i === ILK_KAC - 1 ? 'ayrac' : ''}"><td class="sira">${esc(s[0])}</td><td class="ad">${esc(s[1])}</td><td class="hh">${esc(s[2])}</td><td>${esc(s[3])}</td><td>${esc(s[4])}</td><td>${esc(s[5])}</td><td>${esc(s[6])}</td><td class="p">${esc(s[7])}</td><td class="ikincil">${esc(s[8])}</td><td class="ikincil">${esc(s[9])}</td><td class="${av(s[10])}">${esc(s[10])}</td></tr>`).join('')
  }</tbody></table>`;
}
function sonCiz(sayfa, top) {
  const ms = sonMaclar(), parca = ms.slice(sayfa * SON_SAYFA, (sayfa + 1) * SON_SAYFA);
  $('baslik').textContent = 'Son Maçlar · Son 7 gün';
  $('ek').textContent = top > 1 ? `Sayfa ${sayfa + 1} / ${top}` : `${ms.length} maç`;
  const tr = t => { const m = /^\d{4}-(\d\d)-(\d\d)/.exec(t || ''); return m ? `${m[2]}.${m[1]}` : ''; };
  $('icerik').innerHTML = parca.length ? `<div class="sm">${parca.map(([t, a, sa, b, sb, gno]) =>
    `<div class="mc"><span class="tr">${tr(t)}</span><span class="gr">${gno}. Gr</span><span class="o1">${esc(a)}</span><span class="sk ${sinif(sa, sb)}">${esc(sa)}</span><span class="ay">–</span><span class="sk ${sinif(sb, sa)}">${esc(sb)}</span><span class="o2">${esc(b)}</span></div>`).join('')}</div>`
    : '<div class="bosmesaj">Son 7 günde oynanan maç yok</div>';
}
function icerikCiz(s) {
  if (s.t === 'matris') matrisCiz(V, s.sayfa || 0);
  else if (s.t === 'puan') puanCiz(s.g);
  else sonCiz(s.sayfa, s.top);
}
function goster() {
  clearTimeout(zaman);
  const s = sira[idx];
  const bar = $('ilerle'); bar.style.transition = 'none'; bar.style.width = '0';
  void bar.offsetWidth; bar.style.transition = `width ${s.sn / HIZ}s linear`; bar.style.width = '100%';
  const mat = $('s-matris'), dig = $('s-diger');

function ilerle(y) {
